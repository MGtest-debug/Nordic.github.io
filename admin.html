<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Nordic Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.login-box, .admin-panel{
  background:#1e293b;
  padding:40px;
  border-radius:12px;
  width:90%;
  max-width:400px;
  text-align:center;
  box-shadow:0 0 30px rgba(0,0,0,0.6);
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:6px;
  border:none;
  font-size:16px;
}

button{
  margin-top:15px;
  padding:12px;
  width:100%;
  background:#69c9d0;
  border:none;
  border-radius:6px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:hover{filter:brightness(1.2)}

.admin-panel{display:none}

.action{
  background:#334155;
  margin:10px 0;
  padding:12px;
  border-radius:8px;
  cursor:pointer;
}

.action:hover{background:#475569}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
  <h2>Nordic Admin</h2>
  <p>Skriv lösenord</p>
  <input type="password" id="pass" placeholder="Lösenord">
  <button onclick="login()">Logga in</button>
  <p id="error" style="color:red;"></p>
</div>

<!-- ADMIN PANEL -->
<div class="admin-panel" id="adminPanel">
  <h2>Adminpanel</h2>

  <div class="action" onclick="alert('Server startad')">Starta server</div>
  <div class="action" onclick="alert('Server stoppad')">Stoppa server</div>
  <div class="action" onclick="alert('Broadcast skickat')">Skicka meddelande</div>
  <div class="action" onclick="logout()">Logga ut</div>
</div>

<script>
const PASSWORD="1234";

function login(){
  const input=document.getElementById("pass").value;

  if(input===PASSWORD){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("adminPanel").style.display="block";
  } else {
    document.getElementById("error").innerText="Fel lösenord!";
  }
}

function logout(){
  location.reload();
}
</script>

</body>
</html>
