<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Nordic Minecraft</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<header class="site-header">
  <div class="header-container">
    <a href="#" class="logo">Nordic</a>
    <nav class="nav-menu">
      <a href="#">Hem</a>
      <a href="#gallery">Galleri</a>
      <a href="#contact">Kontakt</a>
      <a href="#admin-login">Admin</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="title-box">
    <h1>Nordic SMP</h1>
    <h2>Minecraft Community</h2>
  </div>
  <p class="intro-text">Joina vår svenska Minecraft-server</p>
</section>

<section class="server-status">
  <h3>Serverstatus</h3>
  <p id="status-text">Online</p>
  <p>IP: nordicsmp.ggwp.cc</p>
</section>

<section class="gallery-section" id="gallery">
<h2>Galleri</h2>
<div class="fridge">
<div class="photo"><img src="img1.jpg"></div>
<div class="photo"><img src="img2.jpg"></div>
<div class="photo"><img src="img3.jpg"></div>
</div>
</section>

<section class="gallery-section" id="admin-login">
<h2>Admin Login</h2>
<input type="password" id="adminPass" placeholder="Lösenord">
<br><br>
<button onclick="checkAdmin()">Logga in</button>
<p id="adminError"></p>
</section>

<section class="gallery-section" id="admin-panel" style="display:none;">
<h2>Admin Panel</h2>
<button onclick="alert('Server startad')">Starta server</button>
<button onclick="alert('Server stoppad')">Stoppa server</button>
<button onclick="alert('Broadcast skickat')">Skicka meddelande</button>
</section>

<section id="contact">
<h2>Kontakt</h2>
<p>Discord & YouTube</p>
</section>

<script>
function checkAdmin(){
  const pass = document.getElementById("adminPass").value;
  if(pass === "1234"){
    document.getElementById("admin-panel").style.display="block";
    document.getElementById("admin-login").style.display="none";
  } else {
    document.getElementById("adminError").innerText="Fel lösenord!";
  }
}
</script>

</body>
</html>
